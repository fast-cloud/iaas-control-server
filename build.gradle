plugins {
    id 'java'
    // 1. Spring Boot 플러그인 추가 (필수)
    id 'org.springframework.boot' version '3.2.0' // Spring Boot 버전은 최신 안정 버전으로 조정하세요
    // 2. Spring 의존성 관리 플러그인 추가 (필수)
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'fast-cloud'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = '17' // Java 버전 명시
    targetCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // OpenStack Swift SDK
    // jackson, snakeyaml 제외 → Spring Boot 3.x 관리 버전과 충돌 방지
    implementation('com.github.openstack4j.core:openstack4j:3.12') {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.datatype'
        exclude group: 'com.fasterxml.jackson.module'
        exclude group: 'org.yaml', module: 'snakeyaml'
    }

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Utilities
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}